name: Portfolio checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install synthetic-demo dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-demo.txt
      - name: Interview demo, analytic contract and saved scores
        run: python tools/interview_demo.py --json
      - name: Source syntax
        run: python tools/check_source_syntax.py
      - name: Synthetic package and image audit cases
        run: python tools/jetson_audit/test_tools.py -v
